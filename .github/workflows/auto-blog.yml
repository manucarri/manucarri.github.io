name: Actualizar Blog, Home y Sitemap Automáticamente

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar robot de actualización
        run: python scripts/actualizar_blog.py

      - name: Guardar cambios automáticamente si hay novedades
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.html blog-en.html index.html index-en.html sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update blog, home y sitemap.xml [skip ci]"
          git push
